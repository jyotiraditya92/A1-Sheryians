<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon - Pikachu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Yellow Section -->
        <div class="left-section">

            <img src="pokemon-logo.png" class="pokemon-logo" alt="Pokemon Logo">

            <div class="content">

                <p class="generation">POKEMON GEN I</p>

                <h1>Pikachu</h1>

                <p class="description">
                    Pikachu is an Electric-type Pokémon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pokémon.
                    They are almost completely covered by
                    yellow fur.
                </p>

                <div class="page-number">
                    <span class="line"></span>
                    <span>01 / 08</span>
                </div>

            </div>

            <!-- Pokeball Decoration -->
            <div class="pokeball"></div>

        </div>


        <!-- Right Cream Section -->
        <div class="right-section">

            <!-- Hamburger -->
            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Pikachu -->
            <img src="pikachu.png" class="pikachu" alt="Pikachu">

            <!-- Navigation Dots -->
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

        </div>

    </div>

</body>
</html>
